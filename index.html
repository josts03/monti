<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Monti — Cover Art & Spotify Canvas for Artists</title>
    <meta
      name="description"
      content="Cover art and Spotify Canvas loops for artists who want their release to look as serious as it sounds. Covers from €150, revisions included."
    />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="author" content="Monti" />
    <!-- TODO: replace your-domain.com with your real domain when you buy it -->
    <link rel="canonical" href="https://your-domain.com/" />

    <!-- Open Graph (link previews on Instagram, WhatsApp, Discord, X …) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Monti" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Monti — Cover Art & Spotify Canvas for Artists" />
    <meta
      property="og:description"
      content="Cover art and Spotify Canvas loops for artists who want their release to look as serious as it sounds."
    />
    <meta property="og:url" content="https://your-domain.com/" />
    <!-- TODO: add public/og-cover.jpg (1200×630) — this is the image shown when the link is shared -->
    <meta property="og:image" content="https://your-domain.com/og-cover.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Monti — cover art and Spotify Canvas for artists" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Monti — Cover Art & Spotify Canvas for Artists" />
    <meta
      name="twitter:description"
      content="Cover art and Spotify Canvas loops for artists who want their release to look as serious as it sounds."
    />
    <meta name="twitter:image" content="https://your-domain.com/og-cover.jpg" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Fonts: preconnect + single stylesheet (faster than @import inside CSS) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500;600&display=swap"
    />

    <!-- Structured data: describes the service, the designer and the offers so
         search and generative AI engines can cite accurate, factual details. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "@id": "https://your-domain.com/#monti",
      "name": "Monti",
      "alternateName": "Monti Moltisanti",
      "description": "Independent designer creating cover art and Spotify Canvas loops for musicians. Covers from €150, up to 3 revision rounds included, files delivered ready for streaming, social and print.",
      "url": "https://your-domain.com/",
      "image": "https://your-domain.com/og-cover.jpg",
      "inLanguage": "en-US",
      "sameAs": ["https://www.instagram.com/montimoltisanti/"],
      "priceRange": "€150 - €500+",
      "areaServed": {
        "@type": "Country",
        "name": "United States"
      },
      "serviceType": [
        "Album cover art design",
        "Single and EP cover art",
        "Spotify Canvas loops",
        "Music visualizers"
      ],
      "knowsAbout": [
        "Cover art for musicians",
        "Album artwork",
        "Spotify Canvas",
        "Music visualizers",
        "Visual identity for releases"
      ],
      "provider": {
        "@type": "Person",
        "name": "Monti",
        "jobTitle": "Cover Art & Motion Designer",
        "url": "https://your-domain.com/",
        "sameAs": ["https://www.instagram.com/montimoltisanti/"]
      },
      "makesOffer": [
        {
          "@type": "Offer",
          "itemOffered": {
            "@type": "Service",
            "name": "Cover Art Design",
            "description": "Single, EP or album artwork delivered ready for Spotify, Apple Music, social and print."
          },
          "price": "150",
          "priceCurrency": "EUR"
        },
        {
          "@type": "Offer",
          "itemOffered": {
            "@type": "Service",
            "name": "Animation / Spotify Canvas Visualizer",
            "description": "Spotify Canvas loops (3–8s) and visualizers delivered in 1080p or 4K."
          },
          "price": "300",
          "priceCurrency": "EUR"
        },
        {
          "@type": "Offer",
          "itemOffered": {
            "@type": "Service",
            "name": "Full Album Visual Identity",
            "description": "Complete visual package for a release — cover, motion and supporting assets."
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Monti — cover art and Spotify Canvas design for artists.
      This site needs JavaScript to run. Contact: instagram.com/montimoltisanti
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
